# Builds the Tingyi Android app (APK) and publishes it as a GitHub Release.
# Download the newest build on your phone from:
#   https://github.com/ryryry-droid/tingyi/releases/latest/download/tingyi.apk
#
# Needs one repository secret, KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions).
# The first build creates the app's signing key, encrypted with that password, and commits it,
# so every later build is signed with the same key and installs as an update.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check the signing password secret
        working-directory: .
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing KEYSTORE_PASSWORD secret::Add a repository secret named KEYSTORE_PASSWORD (GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret), then run this workflow again."
            exit 1
          fi
          if [ ${#KEYSTORE_PASSWORD} -lt 12 ]; then
            echo "::error title=KEYSTORE_PASSWORD too short::Use at least 12 characters, e.g. four random words."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Create the signing key (first build only)
        run: |
          if [ ! -f signing/tingyi-release.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -storetype PKCS12 -keystore signing/tingyi-release.p12 -alias tingyi \
              -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Tingyi" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f signing/tingyi-release.p12
            git commit -m "Add app signing key (encrypted with the KEYSTORE_PASSWORD secret) [skip ci]"
            git push
          fi
          keytool -list -keystore signing/tingyi-release.p12 -storepass "$KEYSTORE_PASSWORD" > /dev/null \
            || { echo "::error title=Signing key won't open::KEYSTORE_PASSWORD doesn't match the key in mobile/signing. Restore the original password."; exit 1; }

      - name: Install packages
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../build.log

      - name: Report build errors
        if: failure()
        working-directory: .
        run: |
          if [ -f mobile/build.log ]; then
            cd mobile
            msg=$(grep -E "error:|Error:|FAILURE|What went wrong|Could not|failed" -A4 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-$(tail -n 40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
          fi

      - name: Sign the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks signing/tingyi-release.p12 --ks-key-alias tingyi \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out tingyi.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs tingyi.apk | head -3
          ls -lh tingyi.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Tingyi app (build ${{ github.run_number }})
          make_latest: true
          files: mobile/tingyi.apk
          body: |
            Android app for Tingyi. On your phone, download **tingyi.apk** below and open it.
            The first time, Android asks you to allow installing apps from your browser; allow it, then tap Install.
            Newer builds install over this one and keep your recordings.
