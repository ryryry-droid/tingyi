# Render blueprint: deploys the server, which also serves the phone recording page.
# On render.com: New → Blueprint → pick this repo, then fill in the two secret values it asks for.
# Free setup: Groq does both speech recognition (Whisper large-v3) and translation.
services:
  - type: web
    name: tingyi
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY      # from console.groq.com → API Keys (free, no card)
        sync: false
      - key: API_TOKEN         # any access code you make up; you'll type it into the page once
        sync: false
      - key: GEMINI_API_KEY    # optional backup translator, from aistudio.google.com → Get API key (free tier)
        sync: false
